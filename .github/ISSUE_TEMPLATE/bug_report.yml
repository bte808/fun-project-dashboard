name: Bug report
description: Report a dashboard rendering, data, or verification problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please avoid sharing tokens, cookies, private repository names, local filesystem paths, or sensitive machine details.
  - type: input
    id: page
    attributes:
      label: Affected page or file
      placeholder: "https://bte808.github.io/fun-project-dashboard/ or scripts/smoke-test.mjs"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the visible behavior or failing command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification details
      description: Include relevant command output or browser details. Redact any private data.
      placeholder: "npm run check ..."
    validations:
      required: false
