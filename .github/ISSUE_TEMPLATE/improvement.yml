name: Improvement
description: Suggest a focused dashboard, data-quality, or documentation improvement.
title: "[Improvement]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Small, verifiable improvements are easiest to review. Please keep suggestions scoped to the public dashboard, public evidence data, or repository maintenance.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why it helps
      description: Explain how this improves readability, verification, data quality, or public OSS evidence.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Suggested checks
      description: How could this be verified?
      placeholder: "npm run check, public URL smoke, generated data diff..."
    validations:
      required: false
